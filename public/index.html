<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X23 Key Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d12;color:#e9edf5;font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}
.app{min-height:100vh;display:flex}.side{width:230px;background:#11141b;border-right:1px solid #252a35;padding:22px 14px}
.brand{font-size:20px;font-weight:800;padding:8px 10px 28px}.brand span{color:#8b7cff}
.nav button{display:block;width:100%;padding:12px;margin:5px 0;text-align:left;background:transparent;color:#aeb6c6;border-radius:9px}
.nav button.active,.nav button:hover{background:#1c2130;color:white}.main{flex:1;padding:28px;max-width:1250px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:28px}.logout{background:#202531;color:#cbd2df;padding:9px 13px;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#12161e;border:1px solid #252b37;border-radius:12px;padding:18px}.stat{font-size:28px;font-weight:800;margin-top:8px}.muted{color:#8d96a8;font-size:13px}
.panel{background:#12161e;border:1px solid #252b37;border-radius:12px;padding:18px;margin-top:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}.input,.select{background:#0d1016;border:1px solid #2b3240;color:white;border-radius:8px;padding:10px 12px}
.primary{background:#7567ff;color:white;padding:10px 14px;border-radius:8px;font-weight:700}.danger{background:#3a1820;color:#ff9aaa;padding:8px 11px;border-radius:7px}.small{padding:7px 10px}
table{width:100%;border-collapse:collapse;margin-top:15px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #252b37;font-size:13px}th{color:#8d96a8}
.badge{padding:4px 7px;border-radius:6px;background:#202735;color:#b9c5d9}.ok{background:#123323;color:#7ee2a8}.expired,.revoked{background:#351820;color:#ff9aa9}
.page{display:none}.page.active{display:block}.login{min-height:100vh;display:grid;place-items:center;background:#0b0d12}.loginbox{width:min(390px,92vw);background:#12161e;border:1px solid #292f3b;padding:28px;border-radius:14px}.loginbox h1{margin-top:0}.full{width:100%;margin:8px 0}.msg{min-height:20px;color:#ff9aa9;margin-top:8px}
.keyout{background:#0c1016;border:1px solid #29303d;padding:12px;border-radius:8px;margin-top:8px;font-family:monospace;word-break:break-all}
@media(max-width:850px){.side{width:180px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block}.side{width:100%;border-right:0}.grid{grid-template-columns:1fr 1fr}.main{padding:16px}}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="loginbox">
    <h1>⚙ X23 Key Manager</h1>
    <p class="muted">Panel privado de administración</p>
    <input id="password" class="input full" type="password" placeholder="Contraseña">
    <button class="primary full" onclick="login()">Entrar</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <aside class="side">
    <div class="brand">X23 <span>Manager</span></div>
    <div class="nav">
      <button class="active" data-page="dashboard">▦ Dashboard</button>
      <button data-page="keys">🔑 Keys</button>
      <button data-page="whitelist">👥 Whitelist</button>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <h1 id="title">Dashboard</h1>
      <button class="logout" onclick="logout()">Salir</button>
    </div>

    <section id="dashboard" class="page active">
      <div class="grid">
        <div class="card"><div class="muted">Total keys</div><div id="totalKeys" class="stat">0</div></div>
        <div class="card"><div class="muted">Keys activas</div><div id="activeKeys" class="stat">0</div></div>
        <div class="card"><div class="muted">Revocadas</div><div id="revokedKeys" class="stat">0</div></div>
        <div class="card"><div class="muted">Whitelist</div><div id="whiteUsers" class="stat">0</div></div>
      </div>
    </section>

    <section id="keys" class="page">
      <div class="panel">
        <h2>Generar keys</h2>
        <div class="row">
          <input id="amount" class="input" type="number" min="1" max="100" value="1">
          <select id="duration" class="select">
            <option value="minutes">Minutos</option>
            <option value="hours" selected>Horas</option>
            <option value="days">Días</option>
            <option value="weeks">Semanas</option>
            <option value="months">30 días</option>
            <option value="permanent">Permanente</option>
          </select>
          <button class="primary" onclick="generateKeys()">Generar</button>
        </div>
        <div id="generated"></div>
      </div>

      <div class="panel">
        <div class="row">
          <input id="keySearch" class="input" placeholder="Buscar usuario o tipo..." oninput="renderKeys()">
          <button class="logout" onclick="loadAll()">Actualizar</button>
        </div>
        <table><thead><tr><th>Tipo</th><th>Usuario</th><th>Creada</th><th>Expira</th><th>Estado</th><th></th></tr></thead>
        <tbody id="keysBody"></tbody></table>
      </div>
    </section>

    <section id="whitelist" class="page">
      <div class="panel">
        <h2>Agregar usuario</h2>
        <div class="row">
          <input id="wlId" class="input" placeholder="Roblox User ID">
          <input id="wlName" class="input" placeholder="Username">
          <button class="primary" onclick="addWhitelist()">Agregar</button>
        </div>
      </div>
      <div class="panel">
        <table><thead><tr><th>User ID</th><th>Username</th><th>Fecha</th><th></th></tr></thead>
        <tbody id="wlBody"></tbody></table>
      </div>
    </section>
  </main>
</div>

<script>
let token = localStorage.getItem("x23_admin_token") || "";
let keys = [], whitelist = [];

const $ = id => document.getElementById(id);
const date = ms => ms ? new Date(ms).toLocaleString("es-MX") : "Permanente";

async function api(url, options={}) {
  options.headers = {...(options.headers||{}), "Content-Type":"application/json", "x-admin-token":token};
  const r = await fetch(url, options);
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.message || "Error");
  return data;
}

async function login(){
  $("loginMsg").textContent="";
  try{
    const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||"No autorizado");
    token=d.token;localStorage.setItem("x23_admin_token",token);
    showApp();loadAll();
  }catch(e){$("loginMsg").textContent=e.message}
}
function showApp(){$("login").style.display="none";$("app").style.display="flex"}
async function logout(){try{await api("/api/admin/logout",{method:"POST"})}catch{}localStorage.removeItem("x23_admin_token");location.reload()}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
  document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));
  $(b.dataset.page).classList.add("active");
  $("title").textContent=b.textContent.replace(/^[^A-Za-z]+/,"").trim();
  if(b.dataset.page==="keys")renderKeys(); if(b.dataset.page==="whitelist")renderWL();
});

async function loadAll(){
  try{
    const [s,k,w]=await Promise.all([api("/api/admin/stats"),api("/api/admin/keys"),fetch("/api/whitelist").then(r=>r.json())]);
    $("totalKeys").textContent=s.totalKeys;$("activeKeys").textContent=s.activeKeys;$("revokedKeys").textContent=s.revokedKeys;$("whiteUsers").textContent=s.whitelistUsers;
    keys=k.keys;whitelist=w;renderKeys();renderWL();
  }catch(e){if(e.message==="No autorizado")location.reload()}
}

async function generateKeys(){
  try{
    const d=await api("/api/admin/keys/generate",{method:"POST",body:JSON.stringify({amount:Number($("amount").value),type:$("duration").value})});
    $("generated").innerHTML="<h3>Keys generadas</h3>"+d.keys.map(k=>`<div class="keyout">${esc(k.key)} — ${k.type} — ${k.expiresAt?date(k.expiresAt):"Permanente"}</div>`).join("");
    loadAll();
  }catch(e){alert(e.message)}
}
function renderKeys(){
  const q=$("keySearch").value.toLowerCase();
  $("keysBody").innerHTML=keys.filter(k=>(k.type+" "+(k.usedUsername||"")+" "+(k.usedBy||"")).toLowerCase().includes(q)).map(k=>{
    let status=k.revoked?'<span class="badge revoked">Revocada</span>':k.expired?'<span class="badge expired">Expirada</span>':'<span class="badge ok">Activa</span>';
    return `<tr><td>${esc(k.type)}</td><td>${esc(k.usedUsername||"Sin usar")}<br><span class="muted">${esc(k.usedBy||"")}</span></td><td>${date(k.createdAt)}</td><td>${date(k.expiresAt)}</td><td>${status}</td><td>${!k.revoked&&!k.expired?`<button class="danger small" onclick="revoke('${k.id}')">Revocar</button>`:""}</td></tr>`
  }).join("")||'<tr><td colspan="6" class="muted">Sin resultados</td></tr>';
}
async function revoke(id){if(!confirm("¿Revocar esta key?"))return;try{await api("/api/admin/keys/"+id+"/revoke",{method:"POST"});loadAll()}catch(e){alert(e.message)}}

async function addWhitelist(){
  const id=$("wlId").value.trim(),name=$("wlName").value.trim();
  if(!id)return alert("Escribe el User ID");
  try{await api("/api/whitelist",{method:"POST",body:JSON.stringify({robloxUserId:id,robloxUsername:name||id})});$("wlId").value="";$("wlName").value="";loadAll()}catch(e){alert(e.message)}
}
async function removeWL(id){if(!confirm("¿Quitar este usuario?"))return;try{await api("/api/admin/whitelist/"+encodeURIComponent(id),{method:"DELETE"});loadAll()}catch(e){alert(e.message)}}
function renderWL(){$("wlBody").innerHTML=whitelist.map(x=>`<tr><td>${esc(x.robloxUserId)}</td><td>${esc(x.robloxUsername)}</td><td>${date(x.createdAt)}</td><td><button class="danger small" onclick="removeWL('${esc(x.robloxUserId)}')">Quitar</button></td></tr>`).join("")||'<tr><td colspan="4" class="muted">Sin usuarios</td></tr>'}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

if(token){showApp();loadAll()}
</script>
</body>
</html>
